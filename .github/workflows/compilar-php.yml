name: Construir PHP para DRAKON (FreeBSD 15.0)

on:
  workflow_dispatch:

jobs:
  build-php:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar y compilar paquetes en FreeBSD 15.0
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          arch: x86_64
          cpu: 2
          mem: 4096
          sync: rsync
          copyback: true
          usesh: true
          run: |
            set -eux
            echo "=== SISTEMA OBJETIVO ==="
            freebsd-version -kru
            sysctl kern.osreldate
            test "$(sysctl -n kern.osreldate)" = "1500068"

            echo "=== INSTALAR GIT ==="
            pkg install -y git
            git --version

            echo "=== OBTENER PORTS QUARTERLY ==="
            git clone --depth 1 --branch 2026Q4 https://git.FreeBSD.org/ports.git /usr/ports

            echo "=== CONFIGURAR PORTS ==="
            export ALLOW_UNSUPPORTED_SYSTEM=YES
            export BATCH=yes

            echo "=== COMPILAR PHP 8.5 Y EXTENSIONES ==="
            make -C /usr/ports/lang/php85 package-recursive
            make -C /usr/ports/databases/php85-mysqli package-recursive
            make -C /usr/ports/databases/php85-pdo package-recursive
            make -C /usr/ports/databases/php85-pdo_mysql package-recursive

            echo "=== LOCALIZAR PAQUETES EN EL SISTEMA ==="
            find /usr/ports /tmp /var/cache -type f -name 'php85-*.pkg' -print
            PHP_PKG="$(find /usr/ports /tmp /var/cache -type f -name 'php85-*.pkg' -print -quit)"
            test -n "$PHP_PKG"
            PKG_DIR="$(dirname "$PHP_PKG")"
            echo "Directorio real: $PKG_DIR"
            ls -lah "$PKG_DIR"

            echo "=== COMPROBAR PAQUETES REQUERIDOS ==="
            for name in php85 php85-mysqli php85-pdo php85-pdo_mysql; do
              find "$PKG_DIR" -maxdepth 1 -type f -name "${name}-*.pkg" -print -quit | grep .
            done

            echo "=== INSTALAR Y VALIDAR PAQUETES ==="
            pkg add "$PKG_DIR"/*.pkg
            /usr/local/bin/php -v
            /usr/local/bin/php -m | tee "$GITHUB_WORKSPACE/php-modules.txt"
            grep -E '^mysqli$' "$GITHUB_WORKSPACE/php-modules.txt"
            grep -E '^PDO$' "$GITHUB_WORKSPACE/php-modules.txt"
            grep -E '^pdo_mysql$' "$GITHUB_WORKSPACE/php-modules.txt"

            echo "=== EXPORTAR PAQUETES AL WORKSPACE ==="
            mkdir -p "$GITHUB_WORKSPACE/paquetes-php-freebsd15"
            find "$PKG_DIR" -maxdepth 1 -type f -name '*.pkg' -exec cp {} "$GITHUB_WORKSPACE/paquetes-php-freebsd15/" \;
            test -n "$(find "$GITHUB_WORKSPACE/paquetes-php-freebsd15" -type f -name '*.pkg' -print -quit)"
            tar -czf "$GITHUB_WORKSPACE/paquetes-php-freebsd15.tar.gz" -C "$GITHUB_WORKSPACE" paquetes-php-freebsd15
            ls -lh "$GITHUB_WORKSPACE/paquetes-php-freebsd15.tar.gz"

      - name: Publicar paquetes compilados
        uses: actions/upload-artifact@v4
        with:
          name: paquetes-php-freebsd15
          path: |
            paquetes-php-freebsd15.tar.gz
            php-modules.txt
          if-no-files-found: error
          retention-days: 7
